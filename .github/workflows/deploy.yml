name: CI/CD

on:
  push:
    branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: "npm"
            - run: npm ci
            - run: npm run lint
    build-and-push:
        needs: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME  }}
                password: ${{ secrets.DOCKERHUB_TOKEN  }}
            - uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: |
                    jeremymacu/sag:latest
                    jeremymacu/sag:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - uses: appleboy/ssh-action@v1
              with:
                host: ${{ secrets.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_SSH_KEY }}
                script: |
                    docker pull jeremymacu/sag:latest
                    docker stop sag-app || true
                    docker rm sag-app || true
                    docker run -d --name sag-app -p 3000:3000 --restart unless-stopped jeremymacu/sag:latest
                    docker image prune -f

